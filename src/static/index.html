<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
          <ul id="participants-list" style="list-style-type: none;">
            <!-- Participants will be dynamically added here -->
          </ul>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <script>
        function addParticipant(name) {
          const participantsList = document.getElementById('participants-list');
          const li = document.createElement('li');
          li.textContent = name;
          const deleteIcon = document.createElement('span');
          deleteIcon.textContent = '🗑️';
          deleteIcon.style.cursor = 'pointer';
          deleteIcon.onclick = () => unregisterParticipant(name);
          li.appendChild(deleteIcon);
          participantsList.appendChild(li);
        }

        function unregisterParticipant(name) {
          // Logic to unregister participant
          alert(name + ' has been unregistered.');
        }
      </script>
      <p>&copy; 2023 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
